<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/SmartFlex/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organic Shop</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" crossorigin href="/SmartFlex/assets/index-Cyotvui9.css">
  </head>
  <body>
    <header class="header">
  <div class="container">
    <p>Header</p>
  </div>
</header>


    <main>
      <!-- Loads the specified .html file -->
      <section id="hero" class="section section-hero">
  <div class="container">
    <p>Hero</p>
  </div>
</section>

      <section id="mission" class="section section-mission">
  <div class="container">
    <p>Mission</p>
  </div>
</section>

      <section id="benefits" class="section section-benefits">
  <div class="container">
    <p>Benefits</p>
  </div>
</section>

      <section id="assorts" class="section section-assorts">
  <div class="container">
    <h3 class="assorts-subtitle">Assortment</h3>
    <h2 class="assorts-title">Explore Our Delicious Organic Product Range</h2>
    <ul class="assorts-product-list">
      <li class="assorts-product-card">
        <img
          src=""
          alt="Top-down view of bright red organic Gala apples arranged on a light wooden surface with a piece of green leaf nearby, soft natural daylight, minimalist setup, linen napkin partially visible, styled for a fresh organic product website."
        />
        <div class="assorts-product-card-after-img-wrap">
          <div class="assorts-product-card-content">
            <ul>
              <li>
                <h4 class="assorts-product-name">Organic Gala Apples</h4>
              </li>
              <li>
                <p class="assorts-product-descr">
                  Juicy, crisp, and sweet apples grown without pesticides.
                </p>
              </li>
            </ul>
            <ul>
              <li><span class="assorts-product-price">$3.50</span></li>
              <li><p class="assorts-product-per-unit">per 1 pound</p></li>
            </ul>
          </div>
          <button class="assorts-product-card-btn" type="button"></button>
        </div>
      </li>
    </ul>
  </div>
</section>

      <section id="feedbacks" class="section section-feedbacks">
  <div class="container">
    <p>Feedbacks</p>
  </div>
</section>

      <section id="faq" class="section section-faq">
  <div class="container">
    <p>FAQ</p>
  </div>
</section>

      <section id="contacts" class="section section-contacts">
  <div class="container">
    <p>Contacts</p>
  </div>
</section>

    </main>

    <footer class="footer">
  <div class="container">
    <p>Footer</p>
  </div>
</footer>

  </body>
</html>
